<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000; overflow: hidden;
  }
  iframe {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    border: none;
  }
</style>
</head>
<body>
<script>
  const p        = new URLSearchParams(location.search);
  const type     = p.get('type')     || 'movie';
  const id       = p.get('id');
  const s        = p.get('s')        || '1';
  const e        = p.get('e')        || '1';
  const progress = p.get('progress') || '0';

  let src;
  if (type === 'tv') {
    src = `https://www.vidking.net/embed/tv/${id}/${s}/${e}?color=00ccff&autoPlay=true&nextEpisode=true&episodeSelector=true&progress=${progress}`;
  } else {
    src = `https://www.vidking.net/embed/movie/${id}?color=00ccff&autoPlay=true&progress=${progress}`;
  }

  const iframe = document.createElement('iframe');
  iframe.src             = src;
  iframe.allowFullscreen = true;
  iframe.allow           = 'autoplay; fullscreen; picture-in-picture';
  document.body.appendChild(iframe);

  // Vidking এর events parent window এ relay করো
  window.addEventListener('message', (event) => {
    if (window.opener) {
      window.opener.postMessage(event.data, '*');
    }
  });
</script>
</body>
</html>
